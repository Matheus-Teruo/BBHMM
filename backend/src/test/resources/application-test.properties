# ===============================
# SPRING
# ===============================
spring.application.name=BBHMM
logging.level.com.BBHMM.backend.BBHMM=INFO

config.spring.security.token.secret=defaultSecret
config.spring.security.issuer=defaultIssuer
config.spring.cors.accepted.url=
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

spring.output.ansi.enabled=ALWAYS

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false


# ===============================
# MAIL SERVICE
# ===============================
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.sender.email=noreply@minhaapp.com
spring.mail.sender.frontend.domain.url=localhost:5173

spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

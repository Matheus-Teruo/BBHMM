services:
  backend:
    container_name: bbhmm_backend
    build:
      context: ./backend
      dockerfile: dockerfile
    env_file:
      - .env
    ports:
      - 8080:8080
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://${DATABASE_HOST}:3306/${DATABASE_DB}
      - S3_URL=http://${STORAGE_HOST}:9000
    networks:
      - public
      - private
    depends_on:
      db:
        condition: service_healthy
      mailhog:
        condition: service_started
  db:
    container_name: bbhmm_database
    image: mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    restart: always
    env_file:
      - .env
    volumes:
      - db-data:/var/lib/mysql
    ports:
      - 3306:3306
    networks:
      - private
    environment:
      - MYSQL_DATABASE=${DATABASE_DB}
      - MYSQL_USER=${DATABASE_USER}
      - MYSQL_PASSWORD=${DATABASE_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${DATABASE_PASSWORD_ROOT}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u${DATABASE_USER:-dev} -p${DATABASE_PASSWORD:-devSecret} --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
  storage:
    container_name: bbhmm_storage
    image: minio/minio
    command: server /data --console-address ":9001"
    restart: always
    env_file:
      - .env
    environment:
      - MINIO_ROOT_USER=${S3_ACCESS_KEY}
      - MINIO_ROOT_PASSWORD=${S3_SECRET_KEY}
    ports:
      - 9000:9000
      - 9001:9001
    networks:
      - public
    volumes:
      - storage-data:/data
  mailhog:
    image: mailhog/mailhog:latest
    container_name: bbhmm_mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - private
  frontend:
    container_name: bbhmm_frontend
    build:
      context: ./frontend
      dockerfile: dockerfile
    env_file:
      - .env
    ports:
      - 5173:5173
    networks:
      - public
    depends_on:
      - backend
  proxy:
    container_name: bbhmm_proxy
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./proxy/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
      - storage
    networks:
      - public
      - tunnel
  cloudflare:
    profiles:
      - cloudflare
    container_name: bbhmm_cloudflare_tunnel
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --url http://nginx:80
    depends_on:
      - proxy
    networks:
      - tunnel

networks:
  public:
  private:
  tunnel:
volumes:
  db-data:
  storage-data:

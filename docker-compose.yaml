services:
  backend:
    container_name: bbhmm_backend
    build:
      context: ./backend
      dockerfile: dockerfile
    env_file:
      - .env
    ports:
      - 8080:8080
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://${DATABASE_HOST}:3306/${DATABASE_DB}
    networks:
      - public
      - private
    depends_on:
      - db
  db:
    container_name: bbhmm_database
    image: mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    restart: always
    env_file:
      - .env
    volumes:
      - db-data:/var/lib/mysql
    ports:
      - 3306:3306
    networks:
      - private
    environment:
      - MYSQL_DATABASE=${DATABASE_DB}
      - MYSQL_USER=${DATABASE_USER}
      - MYSQL_PASSWORD=${DATABASE_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${DATABASE_PASSWORD_ROOT}
  frontend:
    container_name: bbhmm_frontend
    build:
      context: ./frontend
      dockerfile: dockerfile
      args:
        VITE_BACKEND_BASE_URL: ${VITE_BACKEND_BASE_URL}
    env_file:
      - .env
    ports:
      - 5173:5173
    networks:
      - public
    depends_on:
      - backend
networks:
  public:
  private:
volumes:
  db-data:
